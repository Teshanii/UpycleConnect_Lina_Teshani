<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; margin-bottom: 2px; }
        .sidebar a:hover, .sidebar a.active { background: #495057; }
        .content { flex: 1; padding: 30px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>UpcycleConnect</h3>
        <hr>
        <a href="index.html">Tableau de bord</a>
        <a href="utilisateurs.html" class="active">Utilisateurs</a>
        <a href="categories.html">Catégories</a>
        <a href="prestations.html">Prestations</a>
        <a href="evenements.html">Événements</a>
        <a href="annonces.html">Annonces</a>
        <a href="box.html">Box / Conteneurs</a>
        <a href="messages.html">Forum</a>
        <a href="finance.html">Finance</a>
        <a href="langues.html">Langues</a>
    </div>

    <div class="content">
        <h2 class="mb-4">Gestion des Utilisateurs</h2>

        <div class="card mb-4">
            <h5 id="form-title">Ajouter / Modifier un utilisateur</h5>
            <form id="f-user">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="current-status" value="1"> 
                
                <div class="row g-3">
                    <div class="col-md-3"><input type="text" id="nom" class="form-control" placeholder="Nom" required></div>
                    <div class="col-md-3"><input type="text" id="pre" class="form-control" placeholder="Prénom" required></div>
                    <div class="col-md-3"><input type="email" id="mail" class="form-control" placeholder="Email" required></div>
                    <div class="col-md-3"><input type="password" id="mdp" class="form-control" placeholder="Mot de passe"></div>
                    <div class="col-md-4">
                        <select id="role" class="form-select" required>
                            <option value="">Sélectionner un rôle...</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Enregistrer</button>
                <button type="button" class="btn btn-secondary mt-3" onclick="resetForm()">Annuler</button>
            </form>
        </div>

        <div class="card">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th><th>Nom & Prénom</th><th>Email</th><th>Rôle</th><th>Statut</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "http://localhost:8080/api/users";

        async function load() {
            const res = await fetch(API);
            const data = await res.json();
            const tbody = document.getElementById("corps");
            tbody.innerHTML = "";
            if (data) {
                data.forEach(u => {
                    const badge = u.est_actif === 1 ? '<span class="badge bg-success">Actif</span>' : '<span class="badge bg-danger">Banni</span>';
                    const btnToggle = u.est_actif === 1 
                        ? `<button class="btn btn-dark btn-sm" onclick="toggleStatus(${u.id}, 0, '${u.nom}', '${u.pre}', '${u.mail}', ${u.id_role})">Bannir</button>`
                        : `<button class="btn btn-success btn-sm" onclick="toggleStatus(${u.id}, 1, '${u.nom}', '${u.pre}', '${u.mail}', ${u.id_role})">Activer</button>`;

                    tbody.innerHTML += `<tr>
                        <td>${u.id}</td>
                        <td>${u.nom} ${u.pre}</td>
                        <td>${u.mail}</td>
                        <td>${u.role}</td>
                        <td>${badge}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="edit(${u.id},'${u.nom}','${u.pre}','${u.mail}',${u.id_role},${u.est_actif})">Modif</button>
                            ${btnToggle}
                            <button class="btn btn-danger btn-sm" onclick="del(${u.id})">Suppr</button>
                        </td>
                    </tr>`;
                });
            }
        }

        async function loadRoles() {
            const res = await fetch("http://localhost:8080/api/roles");
            const roles = await res.json();
            const select = document.getElementById("role");
            roles.forEach(r => { select.innerHTML += `<option value="${r.id}">${r.lib}</option>`; });
        }

        async function toggleStatus(id, nouveauStatut, nom, pre, mail, roleId) {
            const res = await fetch(`${API}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom, pre, mail, id_role: roleId, est_actif: nouveauStatut })
            });
            
            if (res.status === 403) {
                alert("Action interdite : Les comptes Administrateurs sont protégés.");
            } else {
                load();
            }
        }

        document.getElementById("f-user").onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            const res = await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nom: document.getElementById("nom").value,
                    pre: document.getElementById("pre").value,
                    mail: document.getElementById("mail").value,
                    mdp: document.getElementById("mdp").value,
                    id_role: parseInt(document.getElementById("role").value),
                    est_actif: parseInt(document.getElementById("current-status").value)
                })
            });

            if (res.status === 403) {
                alert("Modification interdite : Ce compte est un Administrateur.");
            } else if (res.ok) {
                resetForm(); 
                load();
            } else {
                alert("Une erreur est survenue lors de l'enregistrement.");
            }
        };

        async function del(id) {
            if (confirm("Supprimer cet utilisateur ?")) {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                
                if (res.status === 403) {
                    alert("Suppression interdite : Impossible de supprimer un Administrateur.");
                } else if (res.status === 409) {
                    const errorData = await res.json();
                    alert(errorData.error);
                } else if (res.ok) {
                    load();
                } else {
                    alert("Une erreur est survenue. Vérifiez si l'utilisateur est lié à d'autres données.");
                }
            }
        }

        function edit(id, nom, pre, mail, roleId, est_actif) {
            document.getElementById("edit-id").value = id;
            document.getElementById("nom").value = nom;
            document.getElementById("pre").value = pre;
            document.getElementById("mail").value = mail;
            document.getElementById("role").value = roleId;
            document.getElementById("current-status").value = est_actif;
            document.getElementById("form-title").innerText = "Modifier l'utilisateur #" + id;
            document.getElementById("mdp").placeholder = "Laisser vide pour garder l'ancien";
        }

        function resetForm() {
            document.getElementById("edit-id").value = "";
            document.getElementById("f-user").reset();
            document.getElementById("mdp").placeholder = "Mot de passe";
            document.getElementById("form-title").innerText = "Ajouter / Modifier un utilisateur";
        }

        load(); loadRoles();
    </script>
</body>
</html>
