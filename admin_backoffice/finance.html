<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background: #495057; }
        .content { flex: 1; padding: 30px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>UpcycleConnect</h3>
        <hr>
        <a href="index.html">Tableau de bord</a>
        <a href="utilisateurs.html">Utilisateurs</a>
        <a href="categories.html">Catégories</a>
        <a href="prestations.html">Prestations</a>
        <a href="evenements.html">Événements</a>
        <a href="annonces.html">Annonces</a>
        <a href="box.html">Box / Conteneurs</a>
        <a href="messages.html">Forum</a>
        <a href="finance.html" class="active">Finance</a>
        <a href="langues.html">Langues</a>
    </div>

    <div class="content">
        <h2 class="mb-4">Suivi Financier</h2>
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card bg-success text-white">
                    <h5>Total Revenus</h5>
                    <h2 id="total-rev">0.00 €</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-danger text-white">
                    <h5>Total Charges</h5>
                    <h2 id="total-cha">0.00 €</h2>
                </div>
            </div>
        </div>

        <div class="card">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Montant</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function load() {
            const res = await fetch("http://localhost:8080/api/transactions");
            const data = await res.json();
            const tbody = document.getElementById("corps");
            tbody.innerHTML = "";
            let rev = 0; let cha = 0;

            if (data) {
                data.forEach(t => {
                    const color = t.type === 'Revenu' ? 'text-success' : 'text-danger';
                    if(t.type === 'Revenu') rev += t.montant; else cha += t.montant;

                    tbody.innerHTML += `<tr>
                        <td>${t.date.split('T')[0]}</td>
                        <td>${t.type}</td>
                        <td class="${color}"><strong>${t.montant.toFixed(2)} €</strong></td>
                    </tr>`;
                });
                document.getElementById('total-rev').innerText = rev.toFixed(2) + " €";
                document.getElementById('total-cha').innerText = cha.toFixed(2) + " €";
            }
        }
        load();
    </script>
</body>
</html>
