<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Prestations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background: #495057; }
        .content { flex: 1; padding: 30px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>UpcycleConnect</h3>
        <hr>
        <a href="index.html">Tableau de bord</a>
        <a href="utilisateurs.html">Utilisateurs</a>
        <a href="categories.html">Catégories</a>
        <a href="prestations.html" class="active">Prestations</a>
        <a href="evenements.html">Événements</a>
        <a href="annonces.html">Annonces</a>
        <a href="box.html">Box / Conteneurs</a>
        <a href="messages.html">Forum</a>
        <a href="finance.html">Finance</a>
        <a href="langues.html">Langues</a>
    </div>

    <div class="content">
        <h2 class="mb-4">Gestion des Prestations</h2>

        <div class="card mb-4">
            <h5 id="form-title">Ajouter / Modifier une prestation</h5>
            <form id="f-pre">
                <input type="hidden" id="edit-id">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nom de la prestation</label>
                        <input type="text" id="nom" class="form-control" placeholder="ex: Réparation Meuble" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Prix (€)</label>
                        <input type="number" step="0.01" id="prix" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Description</label>
                        <input type="text" id="desc" class="form-control" placeholder="Courte description de l'offre">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" id="btn-ok" class="btn btn-primary">Enregistrer</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Annuler</button>
                </div>
            </form>
        </div>

        <div class="card">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "http://localhost:8080/api/prestations";

        async function load() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                const tbody = document.getElementById("corps");
                tbody.innerHTML = "";

                if (data) {
                    data.forEach(p => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${p.id}</td>
                                <td><strong>${p.nom}</strong></td>
                                <td>${p.prix.toFixed(2)} €</td>
                                <td>${p.desc || '-'}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="edit(${p.id}, '${p.nom.replace(/'/g, "\\'")}', ${p.prix}, '${p.desc.replace(/'/g, "\\ text ")}')">Modif</button>
                                    <button class="btn btn-danger btn-sm" onclick="del(${p.id})">Suppr</button>
                                </td>
                            </tr>`;
                    });
                }
            } catch (err) {
                console.error("Erreur chargement prestations:", err);
            }
        }

        document.getElementById("f-pre").onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            
            const payload = {
                nom: document.getElementById("nom").value,
                prix: parseFloat(document.getElementById("prix").value),
                desc: document.getElementById("desc").value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API}/${id}` : API;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            resetForm();
            load();
        };

        function edit(id, nom, prix, desc) {
            document.getElementById("edit-id").value = id;
            document.getElementById("nom").value = nom;
            document.getElementById("prix").value = prix;
            document.getElementById("desc").value = desc;
            document.getElementById("form-title").innerText = "Modifier la prestation #" + id;
            document.getElementById("btn-ok").innerText = "Mettre à jour";
        }

        async function del(id) {
            if (confirm("Voulez-vous vraiment supprimer cette prestation ?")) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                load();
            }
        }

        function resetForm() {
            document.getElementById("edit-id").value = "";
            document.getElementById("f-pre").reset();
            document.getElementById("form-title").innerText = "Ajouter / Modifier une prestation";
            document.getElementById("btn-ok").innerText = "Enregistrer";
        }

        load();
    </script>
</body>
</html>
