<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Box</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background: #495057; }
        .content { flex: 1; padding: 30px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>UpcycleConnect</h3>
        <hr>
        <a href="index.html">Tableau de bord</a>
        <a href="utilisateurs.html">Utilisateurs</a>
        <a href="categories.html">Catégories</a>
        <a href="prestations.html">Prestations</a>
        <a href="evenements.html">Événements</a>
        <a href="annonces.html">Annonces</a>
        <a href="box.html" class="active">Box / Conteneurs</a>
        <a href="messages.html">Forum</a>
        <a href="finance.html">Finance</a>
        <a href="langues.html">Langues</a>
    </div>

    <div class="content">
        <h2 class="mb-4">Gestion des Conteneurs (Box)</h2>
        <div class="card mb-4">
            <h5>Ajouter un conteneur</h5>
            <form id="f-box">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="adresse" class="form-control" placeholder="Adresse complète" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" id="capacite" class="form-control" placeholder="Capacité max" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Ajouter le point de dépôt</button>
            </form>
        </div>

        <div class="card">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Adresse</th>
                        <th>Capacité Max</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "http://localhost:8080/api/box";

        async function load() {
            const res = await fetch(API);
            const data = await res.json();
            const tbody = document.getElementById("corps");
            tbody.innerHTML = "";

            if (data) {
                data.forEach(b => {
                    tbody.innerHTML += `<tr>
                        <td>${b.id}</td>
                        <td>${b.adresse}</td>
                        <td>${b.capacite_max}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="del(${b.id})">Supprimer</button></td>
                    </tr>`;
                });
            }
        }

        document.getElementById("f-box").onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                adresse: document.getElementById("adresse").value,
                capacite_max: parseInt(document.getElementById("capacite").value)
            };
            await fetch(API, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            e.target.reset();
            load();
        };

        async function del(id) {
            if(confirm("Supprimer ce conteneur ?")) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                load();
            }
        }

        load();
    </script>
</body>
</html>
