<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Catégories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background: #495057; }
        .content { flex: 1; padding: 30px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>UpcycleConnect</h3>
        <hr>
        <a href="index.html">Tableau de bord</a>
        <a href="utilisateurs.html">Utilisateurs</a>
        <a href="categories.html" class="active">Catégories</a>
        <a href="prestations.html">Prestations</a>
        <a href="evenements.html">Événements</a>
        <a href="annonces.html">Annonces</a>
        <a href="box.html">Box / Conteneurs</a>
        <a href="messages.html">Forum</a>
        <a href="finance.html">Finance</a>
        <a href="langues.html">Langues</a>
    </div>

    <div class="content">
        <h2 class="mb-4">Gestion des Catégories</h2>

        <div class="card mb-4">
            <h5 id="form-title">Ajouter / Modifier une catégorie</h5>
            <form id="f-cat">
                <input type="hidden" id="edit-id">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="nom" class="form-control" placeholder="Code de référence (ex: MEUBLES, DECO...)" required>
                        <small class="text-muted">Ce code sera utilisé pour les traductions multilingues.</small>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="resetForm()">Annuler</button>
            </form>
        </div>

        <div class="card">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Code Référence (Nom)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "http://localhost:8080/api/categories";

        async function load() {
            const res = await fetch(API);
            const data = await res.json();
            const tbody = document.getElementById("corps");
            tbody.innerHTML = "";

            if (data) {
                data.forEach(c => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${c.id}</td>
                            <td><strong>${c.nom}</strong></td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="edit(${c.id}, '${c.nom}')">Modif</button>
                                <button class="btn btn-danger btn-sm" onclick="del(${c.id})">Suppr</button>
                            </td>
                        </tr>`;
                });
            }
        }

        document.getElementById("f-cat").onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            const payload = {
                nom: document.getElementById("nom").value 
            };

            await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            resetForm();
            load();
        };

        
        function edit(id, nom) {
            document.getElementById("edit-id").value = id;
            document.getElementById("nom").value = nom;
            document.getElementById("form-title").innerText = "Modifier la catégorie #" + id;
        }

        
        async function del(id) {
            if (confirm("Supprimer cette catégorie ?")) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                load();
            }
        }

        
        function resetForm() {
            document.getElementById("edit-id").value = "";
            document.getElementById("f-cat").reset();
            document.getElementById("form-title").innerText = "Ajouter / Modifier une catégorie";
        }

       
        load();
    </script>
</body>
</html>
