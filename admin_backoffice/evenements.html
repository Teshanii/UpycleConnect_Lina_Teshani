<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Événements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background: #495057; }
        .content { flex: 1; padding: 30px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>UpcycleConnect</h3>
        <hr>
        <a href="index.html">Tableau de bord</a>
        <a href="utilisateurs.html">Utilisateurs</a>
        <a href="categories.html">Catégories</a>
        <a href="prestations.html">Prestations</a>
        <a href="evenements.html" class="active">Événements</a>
        <a href="annonces.html">Annonces</a>
        <a href="box.html">Box / Conteneurs</a>
        <a href="messages.html">Forum</a>
        <a href="finance.html">Finance</a>
        <a href="langues.html">Langues</a>
    </div>

    <div class="content">
        <h2 class="mb-4">Gestion des Événements</h2>

        <div class="card mb-4">
            <h5 id="form-title">Ajouter / Modifier un événement</h5>
            <form id="f-ev">
                <input type="hidden" id="edit-id">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="titre" class="form-control" placeholder="Titre de l'événement" required>
                    </div>
                    <div class="col-md-3">
                        <input type="datetime-local" id="date" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" id="prix" class="form-control" placeholder="Prix (€)" required>
                    </div>
                    <div class="col-md-1">
                        <input type="number" id="place" class="form-control" placeholder="Places" required>
                    </div>
                    <div class="col-md-2">
                        <select id="anim" class="form-select" required>
                            <option value="">Animateur...</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Enregistrer</button>
                <button type="button" class="btn btn-secondary mt-3" onclick="resetForm()">Annuler</button>
            </form>
        </div>

        <div class="card">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Titre</th>
                        <th>Date</th>
                        <th>Prix</th>
                        <th>Statut</th>
                        <th>Animateur</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "http://localhost:8080/api/evenements";

        async function load() {
            const res = await fetch(API);
            const data = await res.json();
            const tbody = document.getElementById("corps");
            tbody.innerHTML = "";

            if (data) {
                data.forEach(e => {
                    const badge = e.statut_validation === 1 
                        ? '<span class="badge bg-success">Validé</span>' 
                        : '<span class="badge bg-warning text-dark">En attente</span>';
                    
                    const btnValider = e.statut_validation === 0 
                        ? `<button class="btn btn-success btn-sm" onclick="valider(${e.id})">Valider</button>` 
                        : "";

                    tbody.innerHTML += `
                        <tr>
                            <td>${e.id}</td>
                            <td>${e.titre}</td>
                            <td>${e.date}</td>
                            <td>${e.prix}€</td>
                            <td>${badge}</td>
                            <td>${e.anim}</td>
                            <td>
                                ${btnValider}
                                <button class="btn btn-warning btn-sm" onclick="edit(${e.id},'${e.titre}','${e.date}',${e.prix},${e.place},${e.id_anim})">Modif</button>
                                <button class="btn btn-danger btn-sm" onclick="del(${e.id})">Suppr</button>
                            </td>
                        </tr>`;
                });
            }
        }

        
        async function valider(id) {
            if(confirm("Confirmer la validation de cet événement ?")) {
                await fetch(`${API}/valider/${id}`, { method: 'PUT' });
                load();
            }
        }

    
        async function loadAnimateurs() {
            const res = await fetch("http://localhost:8080/api/users");
            const users = await res.json();
            const select = document.getElementById("anim");
            users.forEach(u => {
                select.innerHTML += `<option value="${u.id}">${u.nom} ${u.pre}</option>`;
            });
        }

        document.getElementById("f-ev").onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            const payload = {
                titre: document.getElementById("titre").value,
                date: document.getElementById("date").value,
                prix: parseFloat(document.getElementById("prix").value),
                place: parseInt(document.getElementById("place").value),
                id_anim: parseInt(document.getElementById("anim").value)
            };

            await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            resetForm();
            load();
        };

        function edit(id, titre, date, prix, place, animId) {
            document.getElementById("edit-id").value = id;
            document.getElementById("titre").value = titre;
            document.getElementById("date").value = date.replace(" ", "T");
            document.getElementById("prix").value = prix;
            document.getElementById("place").value = place;
            document.getElementById("anim").value = animId;
            document.getElementById("form-title").innerText = "Modifier l'événement #" + id;
        }

        async function del(id) {
            if (confirm("Supprimer cet événement ?")) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                load();
            }
        }

        function resetForm() {
            document.getElementById("edit-id").value = "";
            document.getElementById("f-ev").reset();
            document.getElementById("form-title").innerText = "Ajouter / Modifier un événement";
        }

        load();
        loadAnimateurs();
    </script>
</body>
</html>
